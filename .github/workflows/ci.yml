name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-trigger. On 2026-08-06 an Actions outage left run 31120377768
  # wedged: the run object reported `queued` while its re-run was never
  # dispatched, so `rerun` refused ("already running"), `cancel` refused
  # ("already completed"), and `force-cancel` refused ("re-run that has not
  # yet queued"). With only push/pull_request triggers there was no way to
  # get a verdict for that commit short of pushing another one.
  workflow_dispatch:

jobs:
  validate:
    name: validate plugin (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      # v4/v5 target Node 20, which GitHub deprecated and now force-migrates
      # to Node 24 with a warning on every run. v7 targets Node 24 natively.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate manifests / skills / presets / commands / tools syntax / cross-refs
        run: python tools/validate_plugin.py
      - name: Preset schema validator self-tests (positive + negative + parser cases)
        run: python tools/test_validate.py
      - name: Multilingual contract self-tests (pairs + digests + negative cases)
        run: python tools/test_i18n.py
