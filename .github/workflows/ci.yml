name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifests / skills / presets / commands / tools syntax
        run: python tools/validate_plugin.py
      - name: Preset schema validator self-tests (positive + negative cases)
        run: python tools/test_validate.py
